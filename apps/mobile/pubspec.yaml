name: ai_review
description: "Ai Review by Digital Hammerr — the business owner app. Shares accounts and data with the website through /api/v1."
publish_to: 'none'

# build-name is Android versionName / iOS CFBundleShortVersionString; build-number is
# versionCode / CFBundleVersion. Override with --build-name and --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  fl_chart: ^1.3.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  razorpay_flutter: ^1.4.7
  qr_flutter: ^4.1.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Artwork from the website (apps/web/public/marketing), resized for phones.
    - assets/images/

  fonts:
    # The website's typeface (apps/web/assets/fonts), so the app and the site match.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf

# Regenerate with: dart run flutter_launcher_icons
# The source is the website's own icon (apps/web/app/icon.svg), rendered to PNG.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon-square.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F33"
  adaptive_icon_foreground: assets/brand/icon-foreground.png
