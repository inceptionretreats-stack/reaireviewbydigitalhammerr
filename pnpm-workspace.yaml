packages:
  - 'apps/*'
  - 'packages/*'

# Postinstall scripts must be allow-listed explicitly (pnpm 10+), and pnpm 11 fails the install
# when a script is neither allowed nor explicitly refused.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  msgpackr-extract: true
  '@embedded-postgres/windows-x64': true
  # The local development database only. On a Linux build host (Vercel) the linux package is
  # what resolves; its postinstall unpacks a whole PostgreSQL server nothing there will start.
  '@embedded-postgres/linux-x64': false
  '@embedded-postgres/linux-arm64': false
  '@embedded-postgres/darwin-x64': false
  '@embedded-postgres/darwin-arm64': false
